# Tells the app repositories to rebuild when the framework moves.
#
# GoFormsShowcase and GoFormsDemo consume this repository through a path
# replace, so nothing about their builds changes when a commit lands here -
# their CI would only notice a regression the next time someone happened to
# push to them. This closes that gap.
#
# Setup: create a fine-grained PAT with "Contents: read and write" on
# Go-Forms/GoFormsShowcase and Go-Forms/GoFormsDemo, and store it as the
# repository secret DISPATCH_TOKEN. Without it the job is skipped, not failed -
# a missing optional token is not a broken build.
name: Notify dependents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Go-Forms'
    strategy:
      matrix:
        repo: [GoFormsShowcase, GoFormsDemo]

    steps:
      - name: Trigger ${{ matrix.repo }}
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH_TOKEN is not set - skipping ${{ matrix.repo }}."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Go-Forms/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"goforms-updated","client_payload":{"sha":"${{ github.sha }}"}}'
