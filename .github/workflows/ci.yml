# Builds, vets and tests the framework on all three desktop targets it claims
# to support. GoForms renders through Fyne, so the tests open real windows -
# on Linux that needs both the OpenGL/X11 development headers and a display,
# which is what xvfb provides.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev xvfb

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -race ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -race ./...
