<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="GoForms">
  <title>GoForms</title>
  <defs>
    <linearGradient id="gf-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gf-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- The mark is a form window: a title bar with its three buttons, and a
       client area carrying the controls a designer drops on it. -->
  <rect x="20" y="34" width="216" height="188" rx="18" fill="#0f172a"/>
  <rect x="28" y="42" width="200" height="172" rx="12" fill="url(#gf-body)"/>
  <path d="M28 54a12 12 0 0 1 12-12h176a12 12 0 0 1 12 12v22H28z" fill="url(#gf-chrome)"/>

  <circle cx="188" cy="59" r="5" fill="#bfdbfe"/>
  <circle cx="204" cy="59" r="5" fill="#bfdbfe"/>
  <circle cx="220" cy="59" r="5" fill="#f8fafc"/>

  <!-- Docked left rail, then a label, a text field and a default button:
       the smallest arrangement that still reads as a laid-out form. -->
  <rect x="40" y="88" width="44" height="114" rx="7" fill="#cbd5e1"/>
  <rect x="50" y="100" width="24" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="50" y="115" width="24" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="50" y="130" width="24" height="7" rx="3.5" fill="#94a3b8"/>

  <rect x="96" y="90" width="62" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="96" y="110" width="120" height="26" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <rect x="104" y="119" width="46" height="8" rx="4" fill="#cbd5e1"/>

  <rect x="96" y="148" width="62" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="96" y="168" width="120" height="34" rx="9" fill="url(#gf-chrome)"/>
  <path d="M130 185h34m-12-9 12 9-12 9" fill="none" stroke="#f8fafc" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
